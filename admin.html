<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="text-center">

                Admin Dashboard

            </h2>

        </div>

        <div class="card-body">

            <div class="mb-3">

                <label>Product Name</label>

                <input
                type="text"
                id="name"
                class="form-control">

            </div>

            <div class="mb-3">

                <label>Price</label>

                <input
                type="number"
                id="price"
                class="form-control">

            </div>

            <div class="mb-3">

                <label>Brand</label>

                <input
                type="text"
                id="brand"
                class="form-control">

            </div>

            <div class="mb-3">

                <label>Image URL</label>

                <input
                type="text"
                id="image"
                class="form-control">

            </div>

            <button
            id="addProduct"
            class="btn btn-success">

                Add Product

            </button>

        </div>

    </div>

    <div class="card shadow mt-5">

        <div class="card-header">

            <h3>Products</h3>

        </div>

        <div class="card-body">

            <div id="productList">

            </div>

        </div>

    </div>

</div>

<script src="js/products.js"></script>

<script src="js/admin.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img
                id="product-image"
                class="img-fluid rounded shadow">

        </div>

        <div class="col-md-6">

            <h2 id="product-name"></h2>

<h4 class="text-warning"
id="product-rating">
</h4>

<h3
class="text-success"
id="product-price">
</h3>

<h5
id="product-brand">
</h5>

<hr>

<h3>

Customer Reviews

</h3>

<div id="reviews">

</div>

<hr class="my-5">

<h3 class="mb-4">

Write Your Review

</h3>

<div class="mb-3">

<label class="form-label">

Your Name

</label>

<input
type="text"
id="reviewName"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Your Review

</label>

<textarea
id="reviewComment"
class="form-control"
rows="4">

</textarea>

</div>

<button
id="submitReview"
class="btn btn-success">

Submit Review

</button>

            <p>

                Genuine automobile spare part.

                High quality.

                Original Company Product.

            </p>

            <button
                id="detail-cart"
                class="btn btn-primary btn-lg">

                Add To Cart

            </button>

        </div>

    </div>

</div>

<script src="js/products.js"></script>

<script src="js/productDetails.js"></script>

<script src="js/script.js"></script>

</body>

</html>

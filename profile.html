<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Shree Revansiddeshwar Automobiles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="home.html">

            🏍 Shree Revansiddeshwar Automobiles

        </a>

        <a href="home.html" class="btn btn-light">

            Home

        </a>

    </div>

</nav>

<!-- Profile -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h2 class="text-center">

                        👤 My Profile

                    </h2>

                </div>

                <div class="card-body">

                    <div class="text-center mb-4">

                        <img
                        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                        width="120"
                        class="rounded-circle border">

                    </div>

                    <table class="table table-bordered">

                        <tr>

                            <th>Name</th>

                            <td id="profileName">Abhishek Swamy</td>

                        </tr>

                        <tr>

                            <th>Email</th>

                            <td id="profileEmail">abhishek@gmail.com</td>

                        </tr>

                        <tr>

                            <th>Phone</th>

                            <td id="profilePhone">9876543210</td>

                        </tr>

                        <tr>

                            <th>Address</th>

                            <td id="profileAddress">

                                Belagavi, Karnataka

                            </td>

                        </tr>

                    </table>

                    <div class="row text-center mt-4">

                        <div class="col-md-4">

                            <div class="card bg-light">

                                <div class="card-body">

                                    <h3 id="wishlistCount">

                                        0

                                    </h3>

                                    <p>

                                        Wishlist

                                    </p>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-4">

                            <div class="card bg-light">

                                <div class="card-body">

                                    <h3 id="cartCount">

                                        0

                                    </h3>

                                    <p>

                                        Cart Items

                                    </p>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-4">

                            <div class="card bg-light">

                                <div class="card-body">

                                    <h3>

                                        1

                                    </h3>

                                    <p>

                                        Orders

                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="text-center mt-4">

                        <button class="btn btn-danger">

                            Logout

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/profile.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Shree Revansiddeshwar Automobiles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="home.html">
            🏍 Shree Revansiddeshwar Automobiles
        </a>

        <a href="cart.html" class="btn btn-light">
            Back to Cart
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="text-center">
                        Customer Checkout
                    </h3>

                </div>

                <div class="card-body">

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" placeholder="Enter your mobile number">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Delivery Address</label>
                            <textarea class="form-control" rows="3" placeholder="Enter your address"></textarea>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pincode</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Payment Method
                            </label>

                            <select class="form-select">

                                <option>Cash on Delivery</option>
                                <option>UPI</option>
                                <option>Credit Card</option>
                                <option>Debit Card</option>

                            </select>

                        </div>

                        <div class="text-center">

                            <a href="order-success.html"
                               class="btn btn-success btn-lg">

                                Place Order

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
